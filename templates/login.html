
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CareerIQ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;

            background:
                linear-gradient(rgba(5, 10, 25, 0.82), rgba(5, 10, 25, 0.92)),
                url("https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=2000&q=80");

            background-size: cover;
            background-position: center;
        }

        .login-container {
            width: 400px;
            max-width: 100%;
            padding: 45px;
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #66d9ff;
        }

        .subtitle {
            text-align: center;
            color: #c9d0db;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e5e9ef;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);

            background: rgba(255, 255, 255, 0.08);
            color: white;

            outline: none;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #66d9ff;
        }

        .input-group input::placeholder {
            color: #9da7b5;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;

            background: #66d9ff;
            color: #06101d;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 217, 255, 0.3);
        }

        .flash-message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
            color: #ffffff;
            background: rgba(255, 110, 110, 0.15);
            border: 1px solid rgba(255, 110, 110, 0.4);
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #b8c0cc;
            line-height: 1.7;
        }

        .signup a {
            color: #66d9ff;
            text-decoration: none;
            font-weight: bold;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;

            color: #c9d0db;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home:hover {
            color: #66d9ff;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            Career<span>IQ</span>
        </div>

        <p class="subtitle">
            Sign in to continue your career journey
        </p>

        <!-- Login status and error messages -->
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="flash-message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <!-- Login form connected to Flask backend -->
        <form action="/login" method="POST">

            <div class="input-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login →
            </button>

        </form>

        <p class="signup">
            Don't have an account?
            <a href="/register">Create Account</a>
        </p>

        <a href="/" class="back-home">
            ← Back to CareerIQ
        </a>

    </div>

</body>

</html>
