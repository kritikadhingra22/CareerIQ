```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CareerIQ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            color: white;
            background:
                linear-gradient(rgba(5, 10, 25, 0.82), rgba(5, 10, 25, 0.94)),
                url("https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=2000&q=80");
            background-size: cover;
            background-position: center;
        }

        .register-container {
            width: 420px;
            max-width: 100%;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #66d9ff;
        }

        .subtitle {
            text-align: center;
            color: #c9d0db;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e5e9ef;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #66d9ff;
        }

        input::placeholder {
            color: #9da7b5;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: #66d9ff;
            color: #06101d;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.3s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 217, 255, 0.3);
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #b8c0cc;
        }

        .login-link a,
        .back-home {
            color: #66d9ff;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #c9d0db;
            font-size: 13px;
            font-weight: normal;
        }

        .message {
            color: #ffcccc;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="register-container">
        <div class="logo">Career<span>IQ</span></div>

        <p class="subtitle">Create your account and start your career journey</p>

        
{% with messages = get_flashed_messages() %}
    {% for message in messages %}
        <p class="flash-message">{{ message }}</p>
    {% endfor %}
{% endwith %}


        <form action="/register" method="POST">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                    autocomplete="name"
                >
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password (minimum 8 characters)"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div class="input-group">
                <label for="confirm_password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="register-btn">
                Create Account →
            </button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>

        <a href="/" class="back-home">← Back to CareerIQ</a>
    </div>
</body>
</html>
